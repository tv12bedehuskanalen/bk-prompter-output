<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>BK Prompter</title>
    <link rel="stylesheet" href="../public/theme.css" />
    <style>
      @font-face {
        font-family: Proxima;
        src: url("../public/fonts/proxima-nova-regular.woff2");
      }
      /* Colors are shared with public/theme.css. */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px;
        background: var(--panel);
        color: var(--text);
        font:
          14px Proxima,
          system-ui;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 30px;
      }
      h1 {
        font-size: 23px;
        margin: 0;
        letter-spacing: -1px;
      }
      .logo {
        background: var(--accent);
        color: var(--accent-text);
        padding: 10px;
        border-radius: 9px;
        font-weight: 800;
        font-size: 17px;
      }
      .version {
        color: var(--muted);
        font-size: 11px;
        margin-top: 4px;
      }
      .label {
        text-transform: uppercase;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 1.6px;
        margin: 23px 0 10px;
      }
      .network {
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 13px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .network span {
        color: var(--muted);
        font-size: 11px;
      }
      .network strong {
        font-size: 12px;
        font-weight: 500;
        user-select: all;
      }
      .row {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      input,
      select,
      button {
        font: inherit;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: #20282b;
        color: var(--text);
        padding: 11px;
      }
      input {
        width: 100px;
      }
      select {
        flex: 1;
        min-width: 0;
      }
      button {
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
      }
      #message {
        font-size: 12px;
        min-height: 20px;
        color: var(--danger);
        margin: 13px 0;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 24px;
        border-top: 1px solid var(--border);
        padding-top: 20px;
        color: var(--muted);
        font-size: 11px;
      }
      #addresses {
        max-height: 185px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <img
        src="../public/branding/symbol.svg"
        alt="Bedehuskanalen"
        width="44"
        height="44"
      />
      <div>
        <h1 id="name">BK Prompter</h1>
        <div class="version" id="version"></div>
      </div>
    </header>
    <div class="label">Serverport</div>
    <form id="port-form" class="row">
      <input
        type="number"
        id="port"
        min="1024"
        max="65535"
        required
        aria-label="Serverport"
      /><button>Lagre port</button>
    </form>
    <div class="label">Nettverk</div>
    <div id="addresses"></div>
    <div class="label">Åpne webgrensesnitt</div>
    <div class="row">
      <select id="gui" aria-label="Grensesnitt">
        <option value="/projects">Prosjekter og programmer</option>
        <option value="/?editor">Editor</option>
        <option value="/output">Prompter</option>
        <option value="/controller">Fjernkontroll</option>
        <option value="/display">Skjermer</option>
        <option value="/settings">Systeminnstillinger</option></select
      ><button class="primary" id="open">Åpne ↗</button>
    </div>
    <div id="message" role="status"></div>
    <footer>
      <span id="osc"></span><button id="quit">Avslutt server</button>
    </footer>
    <script src="launcher.js"></script>
  </body>
</html>
